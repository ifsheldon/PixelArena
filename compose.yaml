services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3011:3011"
    restart: unless-stopped
    init: true
    volumes:
      - type: bind
        source: ./results
        target: /app/results
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./eval-set
        target: /app/eval-set
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3011/api/images?dataset=celeb').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
